[project]
name = "bench"
version = "0.1.0"
description = "Reproducible Lab 01 LLM benchmark for makerspace support routing"
readme = "README.md"
authors = [
    { name = "Scorcher", email = "scorching.desire@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.33.0",
    "openai>=3.39.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pypdfium2>=5.15.2",
    "python-dotenv>=1.2.4",
    "sqlite-vec>=0.1.9",
    "tiktoken>=0.14.0",
]

[project.scripts]
bench = "bench.run:main"

[project.optional-dependencies]
imagegen = [
    "accelerate>=1.16.0",
    "diffusers>=0.43.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]
tune = [
    "peft>=0.22.0",
    "sentencepiece>=0.2.3",
    "torch>=2.10.0",
    "transformers>=5.23.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

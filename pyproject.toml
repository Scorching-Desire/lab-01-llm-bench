[project]
name = "bench"
version = "0.1.0"
description = "Reproducible Lab 01 LLM benchmark for makerspace support routing"
readme = "README.md"
authors = [
    { name = "Scorcher", email = "scorching.desire@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.33.0",
    "openai>=3.39.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
]

[project.scripts]
bench = "bench.run:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

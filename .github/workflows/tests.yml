name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"

      # Ключів у CI немає: тести не ходять у мережу
      - name: Install the project
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Validate datasets
        run: |
          uv run python scripts/validate_golden.py --tools data/tool_cases.jsonl
          uv run python scripts/validate_docs.py --path data/lab2/docs.jsonl
          uv run python scripts/validate_docs.py --path data/lab2/synth.jsonl
          uv run python scripts/validate_docs.py --path data/lab2/synth-images.jsonl
          uv run python scripts/validate_docs.py --path data/lab2/synth-variants.jsonl

      - name: Check evidence and regenerate reports
        run: |
          uv run python scripts/audit_lab2.py
          uv run python scripts/report.py
          git diff --exit-code -- docs/lab1 docs/lab2
